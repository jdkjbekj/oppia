name: Assign Reviewers on PR Creation

on:
  pull_request:
    types: [opened]  # Trigger the workflow when a PR is created

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest

    steps:
      - name: Assign Reviewers as Assignees
        uses: actions/github-script@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { pull_request } = context.payload;

            if (!pull_request) {
              console.log("No pull request context found. Ensure the workflow is triggered by a pull request.");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pull_request.number;

            // Define reviewers explicitly for testing purposes
            const reviewersToAssign = ["Mayank77maruti", "reviewer2"]; // Replace with real usernames

            console.log(`Assigning reviewers to PR #${prNumber} in ${owner}/${repo}`);
            console.log(`Reviewers to assign: ${reviewersToAssign.join(", ")}`);

            // Assign reviewers to the PR
            await github.issues.addAssignees({
              owner,
              repo,
              issue_number: prNumber,
              assignees: reviewersToAssign,
            });

            console.log(`Successfully assigned reviewers: ${reviewersToAssign.join(", ")}`);
