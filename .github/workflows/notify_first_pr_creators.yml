name: No Reviewer Reminder for First-Time Contributors

on:
  pull_request:
    types: [opened]  # Trigger when a PR is created

jobs:
  first-time-contributor-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check and Notify First-Time Contributors
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { pull_request, repository } = context.payload;
            const owner = repository.owner.login;
            const repo = context.repo.repo;
            const prNumber = pull_request.number;
            const username = pull_request.user.login;

            console.log(`Processing PR #${prNumber} by @${username} in repository ${owner}/${repo}.`);

            // Fetch all PRs created by the contributor
            const userPRs = await github.rest.pulls.list({
              owner,
              repo,
              state: "all",
              per_page: 100,
            });

            // Check if the contributor has any merged PRs
            const mergedPRs = userPRs.data.filter(pr => pr.merged_at && pr.user.login === username);
            const hasNoMergedPRs = mergedPRs.length === 0;

            if (hasNoMergedPRs) {
              console.log(`This is the first PR for @${username}. Sending notification and assigning reviewers.`);

              // Notify first-time contributors
              await github.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: |
                     Hello @${username}! 👋 Thank you for making a PR.

                     Please make sure that your PR is assigned to the correct reviewers -- check the **"Assignees"** section in the sidebar on the right. Typically, this should match the **"Reviewers"** section. If it is not correct, you can leave a comment with the syntax:
                     \`\`\`
                     @reviewer_username PTAL
                     \`\`\`
                     to request that a specific reviewer be assigned.
  
                    Thanks for contributing to the project! 🚀
                ,
              });

              // Assign hardcoded reviewers (replace with CODEOWNERS logic if needed)
              const hardcodedReviewers = ['Mayank77maruti', 'reviewer2']; // Replace with actual GitHub usernames
              if (hardcodedReviewers.length > 0) {
                console.log(`Assigning hardcoded reviewers: ${hardcodedReviewers.join(", ")}`);
                await github.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: prNumber,
                  assignees: hardcodedReviewers,
                });
              } else {
                console.log("No reviewers defined in the hardcoded list.");
              }
            } else {
              console.log(`@${username} has merged PRs. Skipping first-time contributor actions.`);
            }
