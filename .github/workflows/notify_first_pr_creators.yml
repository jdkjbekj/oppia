name: Assign CODEOWNERS as Assignees and Notify Contributor

on:
  pull_request:
    types: [opened]

jobs:
  assign-codeowners:
    runs-on: ubuntu-latest

    steps:
      - name: Assign CODEOWNERS as Assignees
        uses: actions/github-script@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { pull_request } = context.payload;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pull_request.number;
            const username = pull_request.user.login;

            // Fetch requested reviewers and teams from CODEOWNERS
            const requestedReviewers = pull_request.requested_reviewers.map(r => r.login);
            const requestedTeams = pull_request.requested_teams.map(t => t.slug);

            // Check if the user has any merged PRs
            const userPRs = await github.pulls.list({
              owner,
              repo,
              state: "closed",
              per_page: 1,
              direction: "asc",
              sort: "created",
            });
            const isFirstPR = userPRs.data.length === 0;

            // If no reviewers are assigned
            if (requestedReviewers.length === 0 && requestedTeams.length === 0) {
              // Send reminder to the contributor if it's their first PR
              if (isFirstPR) {
                await github.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: `
                    Hello @${username}! Thank you for making a PR. 

                    Please make sure that your PR is assigned to the correct reviewers -- check the "Assignees" section in the sidebar on the right. Typically, this should match the "Reviewers" section. If it is not correct, you can leave a comment with the syntax \`@reviewer_username PTAL\` to request that a specific reviewer be assigned.

                    Thanks!
                  `,
                });
              }
            }

            // Assign individual reviewers as assignees
            if (requestedReviewers.length > 0) {
              await github.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees: requestedReviewers,
              });
              console.log(`Assigned reviewers: ${requestedReviewers.join(", ")}`);
            } else {
              // If no individual reviewers, notify dev workflow team
              console.log("No reviewers found in CODEOWNERS. Notifying team.");
              await github.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `
                  No reviewers were automatically assigned to this PR because no matches were found in the CODEOWNERS file. 
                  @oppia/dev-workflow-reviewers Could you please review the issue?

                  Thank you!
                `,
              });
            }

            // Assign reviewers as assignees (for teams, if any)
            if (requestedTeams.length > 0) {
              console.log(`Teams requested for review: ${requestedTeams.join(", ")}`);
            }
